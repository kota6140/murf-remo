<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account — TakeRemo</title>
  <meta name="description"
    content="Create your TakeRemo account. Start building AI voice employees that move your business forward.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap"
    rel="stylesheet">
  <link rel="icon" type="image/jpeg" href="/assets/tab.jpeg">
  <link rel="apple-touch-icon" href="/assets/tab.jpeg">
  <link rel="stylesheet" href="/auth.css">
  <link rel="stylesheet" href="/auth-stage.css?v=20261104h">
</head>

<body class="auth-body auth-stage">
  <!-- Pure white background, with services drifting softly behind everything and a few floating particles -->
  <div class="as-bg" aria-hidden="true">
    <div class="as-chips" id="as-chips"></div>
    <div id="as-dots"></div>
  </div>

  <div class="as-shell">
    <!-- The logo, centred on top (the same one the services pages use on light backgrounds) -->
    <a href="/" class="as-logo" title="Return to TakeRemo Home">
      <img src="/assets/Takeremo%20AI%20Calling%20Logo%20Transparent.png" alt="TakeRemo AI Calling">
    </a>

    <!-- Left card: industries (filled in by auth-stage.js; each lights up in turn) -->
    <aside class="as-panel as-panel-left" id="as-industries" aria-label="Industries we serve"></aside>

    <!-- Middle: the sign-up card -->
    <div class="as-formcol">
      <div class="as-glow" aria-hidden="true"></div>

      <main class="auth-card">
        <div class="auth-header">
          <h1 class="auth-headline">Create your TakeRemo account</h1>
          <p class="auth-subtitle">Start building conversations that move your business forward.</p>
        </div>

        <!-- Alert Notification Container -->
        <div id="auth-alert-container" style="display: none;"></div>

        <form class="auth-form" id="signup-form" novalidate>
          <!-- Full Name -->
          <div class="form-group">
            <label class="form-label" for="signup-name">Full Name</label>
            <div class="input-wrapper">
              <svg class="as-ico" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" /><circle cx="12" cy="7" r="4" /></svg>
              <input type="text" id="signup-name" class="auth-input" placeholder="e.g. Rahul Sharma" required
                autocomplete="name">
            </div>
          </div>

          <!-- Email -->
          <div class="form-group">
            <label class="form-label" for="signup-email">Work Email</label>
            <div class="input-wrapper">
              <svg class="as-ico" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 4h16a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z" /><polyline points="22,6 12,13 2,6" /></svg>
              <input type="email" id="signup-email" class="auth-input" placeholder="name@company.com" required
                autocomplete="email">
            </div>
          </div>

          <!-- Password -->
          <div class="form-group">
            <label class="form-label" for="signup-password">Password</label>
            <div class="input-wrapper">
              <svg class="as-ico" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="11" width="18" height="11" rx="2" ry="2" /><path d="M7 11V7a5 5 0 0 1 10 0v4" /></svg>
              <input type="password" id="signup-password" class="auth-input input-has-toggle"
                placeholder="At least 6 characters" required autocomplete="new-password">
              <button type="button" class="btn-toggle-pwd" data-target="signup-password"
                aria-label="Toggle password visibility">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                  <circle cx="12" cy="12" r="3" />
                </svg>
              </button>
            </div>
          </div>

          <!-- Confirm Password -->
          <div class="form-group">
            <label class="form-label" for="signup-confirm-password">Confirm Password</label>
            <div class="input-wrapper">
              <svg class="as-ico" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" /></svg>
              <input type="password" id="signup-confirm-password" class="auth-input input-has-toggle"
                placeholder="Re-enter password" required autocomplete="new-password">
              <button type="button" class="btn-toggle-pwd" data-target="signup-confirm-password"
                aria-label="Toggle password visibility">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                  <circle cx="12" cy="12" r="3" />
                </svg>
              </button>
            </div>
          </div>

          <!-- Submit Button -->
          <button type="submit" class="btn-auth-primary">
            <span>Create Account</span>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
              <polyline points="9 18 15 12 9 6" />
            </svg>
          </button>
        </form>

        <!-- Step 2: email verification code (hidden until the signup form is submitted) -->
        <form class="auth-form" id="otp-form" style="display: none;" novalidate>
          <div class="form-group">
            <label class="form-label" for="otp-input">6-digit verification code</label>
            <div class="input-wrapper">
              <input type="text" id="otp-input" class="auth-input otp-input" inputmode="numeric" pattern="[0-9]*"
                maxlength="6" placeholder="000000" autocomplete="one-time-code" required>
            </div>
          </div>
          <button type="submit" class="btn-auth-primary">
            <span>Verify &amp; Create Account</span>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
              <polyline points="9 18 15 12 9 6" />
            </svg>
          </button>
          <div class="otp-actions">
            <button type="button" class="otp-link" id="otp-resend">Resend code</button>
            <button type="button" class="otp-link" id="otp-change">Change email</button>
          </div>
        </form>

        <!-- OR Divider -->
        <div class="auth-divider">
          <span>OR</span>
        </div>

        <!-- Google Sign-In Button (UI placeholder) -->
        <button type="button" class="btn-google" id="btn-google-auth">
          <svg class="google-icon" width="18" height="18" viewBox="0 0 24 24">
            <path fill="#4285F4"
              d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" />
            <path fill="#34A853"
              d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" />
            <path fill="#FBBC05"
              d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z" />
            <path fill="#EA4335"
              d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z" />
          </svg>
          <span>Continue with Google</span>
        </button>

        <!-- Footer Link -->
        <footer class="auth-footer">
          <span>Already have an account?</span>
          <a href="/signin" class="auth-footer-link">Sign In</a>
        </footer>
      </main>

      <a href="/" class="auth-back-link">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <polyline points="15 18 9 12 15 6" />
        </svg>
        <span>Back to TakeRemo</span>
      </a>
    </div>

    <!-- Right card: services (filled in by auth-stage.js; each lights up in turn) -->
    <aside class="as-panel as-panel-right" id="as-services" aria-label="Our services"></aside>

    <!-- Bottom: what you get (filled in by auth-stage.js) -->
    <section class="as-features" id="as-features" aria-label="Highlights"></section>
  </div>

  <script src="/auth-client.js"></script>
  <script src="/auth-stage.js?v=20261104i"></script>
</body>

</html>
